<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 2: Retrieve JSON Data</title>
</head>
<body>
    <h1>Book Information</h1>

    <h2>Title of first book</h2>
    <p id="firstTitle"></p>
    <h2>Author of second book</h2>
    <p id="secondAuthor"></p>
    <h2>Genres of both books</h2>
    <ul id="genresList"></ul>
    <p id="status" role="status" aria-live="polite"></p>

    <script>
        async function loadBooks() {
            const status = document.getElementById("status");
            const genresList = document.getElementById("genresList");

            try {
                const response = await fetch("books.json");

                if (!response.ok) {
                    throw new Error("Failed to load JSON file");
                }

                const data = await response.json();

                if (!Array.isArray(data.books) ||
                    data.books.length < 2) {
                    throw new Error("Invalid book data");
                }

                const firstBook = data.books[0];
                const secondBook = data.books[1];

                document.getElementById("firstTitle")
                    .textContent = firstBook.title;

                document.getElementById("secondAuthor")
                    .textContent = secondBook.author;

                genresList.replaceChildren();

                for (const book of data.books.slice(0, 2)) {
                    if (typeof book.title !== "string" ||
                        !Array.isArray(book.genres) ||
                        !book.genres.every(g => typeof g === "string")) {
                        throw new Error("Invalid book information");
                    }

                    const item = document.createElement("li");

                    item.textContent =
                        book.title + " — " + book.genres.join(", ");

                    genresList.appendChild(item);
                }

                status.textContent = "Books loaded successfully!";
            } catch (error) {
                document.getElementById("firstTitle").textContent = "";
                document.getElementById("secondAuthor").textContent = "";
                genresList.replaceChildren();

                status.textContent =
                    "Unable to load book information. Please try again.";
                console.error(error);
            }
        }

        loadBooks();
    </script>
</body>
</html>
